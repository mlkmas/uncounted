[project]
name = "uncounted"
version = "0.1.0"
description = "Satellite estimates of unreported fire emissions from wildfires and conflicts, anchored on chain"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
uncounted = "uncounted.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["uncounted"]
